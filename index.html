<style>
:root{--sky:#7fd4ff;--sky2:#c9efff;--sun:#ffd23f;--pink:#ff6fa5;--grass:#3ecf8e;--ink:#2b2d6e;--card:#fff;--ora:#ff9a3c;--blue:#4d8dff;

*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Baloo 2','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;background:linear-gradient(var(--sky) 0%,var(--sky2) 70%,#bff0d4 70%);color:var(--ink);overflow:hidden;position:relative}
.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.9;animation:drift 40s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:120px;height:38px;top:8%;left:-150px}.c1:before{width:60px;height:60px;top:-28px;left:16px}.c1:after{width:48px;height:48px;top:-18px;left:60px}
.c2{width:90px;height:30px;top:20%;left:-120px;animation-delay:-18s;animation-duration:55s}.c2:before{width:46px;height:46px;top:-22px;left:12px}.c2:after{width:36px;height:36px;top:-14px;left:44px}
@keyframes drift{to{transform:translateX(130vw)}}
.app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:12px 16px 18px;gap:10px;max-width:900px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}.logo{width:clamp(48px,13vw,68px);height:auto;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
h1{margin:0;font-size:clamp(22px,5vw,34px);font-weight:800;color:#fff;text-shadow:0 3px 0 var(--blue),0 5px 0 rgba(0,0,0,.12);letter-spacing:.5px}
.board{flex:1;width:100%;min-height:0;background:var(--card);border:6px solid var(--sun);border-radius:36px;box-shadow:0 8px 0 var(--ora);display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;position:relative}
#word{display:flex;gap:.02em;font-weight:800;line-height:1;white-space:nowrap;font-size:100px;transition:transform .2s}
#word .l{display:inline-block}#word .s{display:inline-flex}#word.syl{gap:0}
#word .s{margin:0 .14em;padding:0 .04em .02em;border-bottom:.05em solid currentColor;border-radius:.04em}
#word.tap .l,#word.tap .s{cursor:pointer;transition:transform .12s}
#word.tap .hit{transform:scale(1.25)}
#word.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3) rotate(-6deg)}to{transform:scale(1)}}
.hint{font-size:clamp(20px,5vw,30px);font-weight:600;color:#8a8fc9;text-align:center;line-height:1.2;padding:0 10px}
.say{font-size:clamp(18px,4.5vw,24px);font-weight:600;color:var(--ink);background:#ffffffcc;border-radius:20px;padding:4px 16px;min-height:34px;text-align:center}
.controls{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;justify-items:center;width:100%;max-width:520px;column-gap:clamp(4px,1.5vw,12px)}
#mic{width:clamp(84px,22vw,128px);height:clamp(84px,22vw,128px);border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:clamp(44px,12vw,60px);cursor:pointer;box-shadow:0 8px 0 #d94a85;transition:transform .1s,box-shadow .1s;display:grid;place-items:center}
#mic:active{transform:translateY(6px);box-shadow:0 2px 0 #d94a85}
#mic.on{background:var(--grass);box-shadow:0 8px 0 #25a56c;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.sm{width:clamp(46px,13vw,68px);height:clamp(46px,13vw,68px);border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:clamp(22px,6vw,30px);cursor:pointer;box-shadow:0 6px 0 #2f66c9}
.sm.on{background:var(--grass);box-shadow:0 6px 0 #25a56c;outline:4px solid var(--sun)}
.sm:active{transform:translateY(4px);box-shadow:0 2px 0 #2f66c9}
.sm:disabled{opacity:.4}
.typebox{display:none;gap:8px;width:100%;max-width:460px}
.typebox input{flex:1;min-width:0;font:inherit;font-size:22px;padding:8px 16px;border-radius:99px;border:4px solid var(--sun);outline:none;color:var(--ink)}
.typebox button{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:99px;padding:0 20px;background:var(--grass);color:#fff;box-shadow:0 4px 0 #25a56c;cursor:pointer}
.pad{position:absolute;inset:0;background:#fffdf4;border-radius:30px;display:flex;flex-direction:column;align-items:center;padding:10px;z-index:5}
.pad[hidden]{display:none}
.pad .bar{display:flex;gap:10px;align-self:flex-end}
.pad .bar button{width:48px;height:48px;border-radius:50%;border:0;font-size:22px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 4px 0 #2f66c9}
.pad .bar button:active{transform:translateY(3px);box-shadow:0 1px 0 #2f66c9}
#svgw{flex:1;min-height:0;width:100%}#svgw svg{width:100%;height:100%}
.ink{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-in-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.ink{stroke-dashoffset:0!important}}
.b{display:flex;flex-direction:column;align-items:center;gap:4px}
.b span{font-weight:800;font-size:clamp(11px,3vw,15px);color:#fff;text-shadow:0 2px 0 rgba(43,45,110,.4)}
.pad .bar{align-items:flex-start;align-self:center;justify-content:center;gap:8px}.pad .b span{color:var(--ink);text-shadow:none;font-size:13px}
#svgw svg{touch-action:none}
.ouvir{position:absolute;top:10px;right:12px;z-index:1}.ouvir[hidden]{display:none}
.ouvir .sm{width:58px;height:58px;font-size:26px;background:var(--ora);border:4px solid var(--ink);box-shadow:0 5px 0 #c86a12}.ouvir .sm:disabled{opacity:.6}.ouvir .sm:active{box-shadow:0 1px 0 #c86a12}.ouvir span{color:var(--ink);text-shadow:none;font-size:13px;font-weight:800}
button:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#fffdf4}}
:root[data-theme="dark"]{--card:#fffdf4}
</style>
</head>

="#3a9d4f"/><circle cx="63" cy="84" r="1.6" fill="#3a9d4f"/><g transform="rotate(-12 94 100)"><rect x="86" y="94" width="14" height="14" rx="2" fill="#ffd23f" stroke="#c9961c" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M90 98 L96 104 M96 98 L90 104" stroke="#c9961c" stroke-width="1.5" stroke-linecap="round"/></g><path d="M104 18 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ffd23f" stroke="#e0a800" stroke-width="1.2" stroke-linejoin="round"/></svg><h1>Palavra Feliz</h1></div>

<script>
const COLORS=['#ff6fa5','#4d8dff','#ff9a3c','#3ecf8e','#a560ff','#ff5a5a'];
const $=id=>document.getElementById(id);
const wordEl=$('word'),hint=$('hint'),say=$('say'),mic=$('mic'),again=$('again'),board=$('board');
let current='',mode='none';
const NAMES={a:'ah',b:'bê',c:'cê',d:'dê',e:'eh',f:'éfe',g:'gê',h:'agá',i:'i',j:'jota',k:'cá',l:'éle',m:'ême',n:'ene',o:'oh',p:'pê',q:'quê',r:'érre',s:'ésse',t:'tê',u:'u',v:'vê',w:'dáblio',x:'xis',y:'ípsilon',z:'zê'};
const V='aeiouáéíóúâêôãõàü',STRONG='aeoáéóâêô';
function syllabify(w){
  const t=[];
  for(let i=0;i<w.length;i++){
    const p=w.slice(i,i+2),n=w[i+2]||'';
    if(['ch','lh','nh'].includes(p)||((p==='qu'||p==='gu')&&'eéêiíè'.includes(n))){t.push(p);i++;}
    else t.push(w[i]);
  }
  const isV=x=>x.length===1&&V.includes(x);
  const cuts=[];let prevV=-1;
  for(let i=0;i<t.length;i++){
    if(!isV(t[i]))continue;
    if(prevV>=0){
      const gap=i-prevV-1;
      if(gap===0){const a=t[prevV],b=t[i];if((STRONG.includes(a)&&STRONG.includes(b))||'íú'.includes(b))cuts.push(i);}
      else if(gap===1)cuts.push(prevV+1);
      else{const a=t[i-2],b=t[i-1];cuts.push(('bcdfgptv'.includes(a)&&'lr'.includes(b)&&a.length===1)?i-2:i-1);}
    }
    prevV=i;
  }
  const out=[];let st=0;
  [...cuts,t.length].forEach(c=>{if(c>st){out.push(t.slice(st,c));st=c;}});
  return out.length?out:[t];
}
function nameOf(ch){const b=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'');return NAMES[b]||ch;}
function speak(t,q){
  t=String(t).replace(/\p{Extended_Pictographic}|\uFE0F|\u200d/gu,'').trim();if(!t)return;
  try{if(!(q||keepQ))speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.8;u.pitch=1.2;speechSynthesis.speak(u);}catch(e){}
}
const ANDROID=/Android/i.test(navigator.userAgent);
function speakSlow(t){
  t=String(t).replace(/\p{Extended_Pictographic}|\uFE0F|\u200d/gu,'').trim();if(!t)return;
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(ANDROID?t+'.':t);
    u.lang='pt-BR';u.rate=ANDROID?.6:.8;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}
}
function bump(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),220);}
function mk(text,color,cls){const s=document.createElement('span');s.className=cls;s.textContent=text.toUpperCase();s.style.color=color;return s;}
function render(){
  if(!current)return;
  hint.hidden=true;wordEl.hidden=false;wordEl.innerHTML='';
  wordEl.className=(mode==='syl'?'syl ':'')+(mode!=='none'?'tap':'');
  if(mode==='syl'){
    syllabify(current).forEach((sy,i)=>{
      const txt=sy.join(''),g=document.createElement('span');g.className='s';
      sy.forEach(ch=>g.appendChild(mk(ch,COLORS[i%COLORS.length],'l0')));
      g.style.color=COLORS[i%COLORS.length];
      g.querySelectorAll('span').forEach(x=>x.style.pointerEvents='none');
      g.onclick=()=>{bump(g);speakSlow(txt);};
      wordEl.appendChild(g);
    });
  }else{
    let wk=0;[...current].forEach((ch,i)=>{
      const s=mk(ch===' '?'\u00a0':ch,COLORS[i%COLORS.length],'l');
      if(mode==='let'&&ch!==' ')s.onclick=()=>{bump(s);speakSlow(nameOf(ch));};
      if(mode==='write'&&G[base(ch)]){const k=wk++;s.onclick=()=>{bump(s);openWriter(k);};}
      wordEl.appendChild(s);
    });
  }
  fit();
}
function fit(){
  if(wordEl.hidden)return;
  wordEl.style.fontSize='100px';
  const w=board.clientWidth-40,h=board.clientHeight-40;
  wordEl.style.fontSize=Math.min(100*Math.min(w/wordEl.scrollWidth,h/wordEl.scrollHeight),420)+'px';
}
function show(text){
  text=text.trim().toLowerCase().replace(/[.,!?]/g,'');
  if(!text)return;
  current=text;closePad();render();
  wordEl.classList.add('pop');again.disabled=false;$('ouv').hidden=false;
  say.textContent=mode==='let'?'Toque numa letra!':mode==='syl'?'Toque numa sílaba!':mode==='write'?'Toque numa letra para escrever!':'Muito bem! 🌟';
  speak(text);
}
function setMode(m){
  mode=mode===m?'none':m;closePad();
  [['lt','let'],['sy','syl'],['wr','write']].forEach(([id,k])=>$(id).classList.toggle('on',mode===k));
  say.textContent={let:'Toque numa letra para ouvir!',syl:'Toque numa sílaba para ouvir!',write:'Toque numa letra para aprender a escrever!'}[mode]||'';
  if(mode!=='none')speak(say.textContent);
  render();
}
$('lt').onclick=()=>setMode('let');
$('sy').onclick=()=>setMode('syl');
const G={
A:["M50 10 L20 100","M50 10 L80 100","M32 68 L68 68"],
B:["M25 10 V100","M25 10 H50 C75 10 75 55 50 55 H25","M50 55 C82 55 82 100 50 100 H25"],
C:["M78 25 C65 5 25 8 22 50 C20 92 60 108 80 80"],
D:["M25 10 V100","M25 10 H45 C85 10 85 100 45 100 H25"],
E:["M25 10 V100","M25 10 H78","M25 55 H68","M25 100 H78"],
F:["M25 10 V100","M25 10 H78","M25 55 H68"],
G:["M78 25 C65 5 25 8 22 50 C20 92 65 108 80 75 V58 H52"],
H:["M25 10 V100","M75 10 V100","M25 55 H75"],
I:["M50 10 V100","M32 10 H68","M32 100 H68"],
J:["M62 10 V80 C62 108 25 105 22 78","M45 10 H80"],
K:["M25 10 V100","M75 10 L25 58","M42 44 L78 100"],
L:["M25 10 V100 H78"],
M:["M20 100 V10 L50 70 L80 10 V100"],
N:["M25 100 V10 L75 100 V10"],
O:["M50 10 C10 10 10 100 50 100 C90 100 90 10 50 10"],
P:["M25 10 V100","M25 10 H50 C85 10 85 58 50 58 H25"],
Q:["M50 10 C10 10 10 100 50 100 C90 100 90 10 50 10","M58 78 L82 108"],
R:["M25 10 V100","M25 10 H50 C85 10 85 55 50 55 H25","M50 55 L78 100"],
S:["M76 25 C68 8 24 8 26 32 C28 56 78 50 76 78 C74 106 30 104 22 80"],
T:["M20 10 H80","M50 10 V100"],
U:["M25 10 V68 C25 108 75 108 75 68 V10"],
V:["M20 10 L50 100 L80 10"],
W:["M15 10 L32 100 L50 40 L68 100 L85 10"],
X:["M22 10 L78 100","M78 10 L22 100"],
Y:["M22 10 L50 55 L78 10","M50 55 V100"],
Z:["M22 10 H78 L22 100 H78"]};
const base=c=>c.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const LS=()=>[...current].map(base).filter(b=>G[b]);
const DUR=2.8,STEP=3.6;let wIdx=0,padMode='watch',keepQ=false;
function badgePos(P){
  const ns='http://www.w3.org/2000/svg',sv=document.createElementNS(ns,'svg');
  sv.setAttribute('style','position:absolute;width:0;height:0;visibility:hidden');document.body.appendChild(sv);
  const out=[];
  P.forEach(d=>{
    const p=document.createElementNS(ns,'path');p.setAttribute('d',d);sv.appendChild(p);
    const n=p.getTotalLength();let pos=p.getPointAtLength(0);
    for(const off of [0,20,32,44]){const q=p.getPointAtLength(Math.min(off,n));if(out.every(o=>Math.hypot(o.x-q.x,o.y-q.y)>=17)){pos=q;break;}}
    out.push({x:pos.x,y:pos.y});
  });
  sv.remove();return out;
}
function closePad(){$('pad').hidden=true;$('svgw').innerHTML='';}
function openWriter(i){wIdx=i;drawLetter();}
function drawLetter(){
  const L=LS();
  if(wIdx>=L.length){closePad();say.textContent='Parabéns! Você escreveu '+current.toUpperCase()+'! 🎉';return;}
  padMode='watch';const P=G[L[wIdx]],col=COLORS[wIdx%COLORS.length],BP=badgePos(P);
  let h='<svg viewBox="-40 0 180 120" preserveAspectRatio="xMidYMid meet"><line x1="-40" x2="140" y1="10" y2="10" stroke="#9fd0ff" stroke-width="1.5"/><line x1="-40" x2="140" y1="55" y2="55" stroke="#ffb3cf" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="-40" x2="140" y1="100" y2="100" stroke="#9fd0ff" stroke-width="1.5"/>';
  const T='fill="none" stroke-linecap="round" stroke-linejoin="round"';
  P.forEach(d=>h+=`<path d="${d}" ${T} stroke="#e6e8f7" stroke-width="9"/>`);
  P.forEach((d,i)=>h+=`<path class="ink" d="${d}" pathLength="1" stroke="${col}" style="animation-delay:${(.5+i*STEP).toFixed(1)}s;animation-duration:${DUR}s"/>`);
  P.forEach((d,i)=>{
    const t=.5+i*STEP,{x,y}=BP[i];
    h+=`<circle cx="${x}" cy="${y}" r="8" fill="#ff6fa5"/><text x="${x}" y="${+y+4.5}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="Baloo 2,sans-serif">${i+1}</text>`;
    h+=`<circle r="7" fill="#ffd23f" stroke="#2b2d6e" stroke-width="3" opacity="0"><set attributeName="opacity" to="1" begin="${t.toFixed(1)}s"/><set attributeName="opacity" to="0" begin="${(t+DUR).toFixed(1)}s"/><animateMotion path="${d}" dur="${DUR}s" begin="${t.toFixed(1)}s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/></circle>`;
  });
  $('svgw').innerHTML=h+'</svg>';$('pad').hidden=false;
  say.textContent=`Letra ${L[wIdx]} — ${wIdx+1} de ${L.length}`;
  speakSlow(NAMES[L[wIdx].toLowerCase()]);
}
$('wr').onclick=()=>setMode('write');
addEventListener('resize',fit);
again.onclick=()=>current&&speak(current);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function openTyping(msg){$('tb').style.display='flex';if(msg)say.textContent=msg;}
$('kb').onclick=()=>{const t=$('tb');t.style.display=t.style.display==='flex'?'none':'flex';if(t.style.display==='flex')$('inp').focus();};
function submit(){const v=$('inp').value;$('inp').value='';show(v);}
$('ok').onclick=submit;
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
mic.onclick=()=>{
  if(!SR){openTyping('Este aparelho não ouve a voz. Escreva a palavra!');return;}
  if(listening){rec&&rec.stop();return;}
  rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{listening=true;mic.classList.add('on');mic.textContent='👂';say.textContent='Estou ouvindo...';};
  rec.onresult=e=>{show(e.results[0][0].transcript);};
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed')openTyping('Libere o microfone ou escreva a palavra.');
    else if(e.error==='no-speech')say.textContent='Não ouvi nada. Tente de novo!';
    else say.textContent='Vamos tentar de novo?';
  };
  rec.onend=()=>{listening=false;mic.classList.remove('on');mic.textContent='🎤';};
  try{rec.start();}catch(e){}
};
const SVGN='<svg viewBox="-40 0 180 120" preserveAspectRatio="xMidYMid meet"><line x1="-40" x2="140" y1="10" y2="10" stroke="#9fd0ff" stroke-width="1.5"/><line x1="-40" x2="140" y1="55" y2="55" stroke="#ffb3cf" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="-40" x2="140" y1="100" y2="100" stroke="#9fd0ff" stroke-width="1.5"/>';
function rs(a,n){
  const c=[0];for(let i=1;i<a.length;i++)c.push(c[i-1]+Math.hypot(a[i].x-a[i-1].x,a[i].y-a[i-1].y));
  const T=c[c.length-1],o=[];let j=1;
  for(let k=0;k<n;k++){const t=T*k/(n-1);while(j<a.length-1&&c[j]<t)j++;const d=c[j]-c[j-1]||1,u=Math.min(1,Math.max(0,(t-c[j-1])/d));
    o.push({x:a[j-1].x+(a[j].x-a[j-1].x)*u,y:a[j-1].y+(a[j].y-a[j-1].y)*u});}
  return o;
}
function okStroke(pts,r){
  const c=rs(pts,20),d=c.map((p,i)=>Math.hypot(p.x-r[i].x,p.y-r[i].y)),m=d.reduce((a,b)=>a+b)/d.length;
  return m<=14&&Math.max(...d)<=30&&d[0]<=22&&d[19]<=26;
}
function inst(t){say.textContent=t;speak(t);}
function drawTrace(){
  const L=LS();padMode='trace';
  const P=G[L[wIdx]],col=COLORS[wIdx%COLORS.length],BP=badgePos(P);let h=SVGN;
  P.forEach(d=>h+=`<path class="mold" d="${d}" fill="none" stroke="#dfe2f6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`);
  P.forEach((d,i)=>{const {x,y}=BP[i];h+=`<g id="bd${i}"><circle cx="${x}" cy="${y}" r="8" fill="#ff6fa5"/><text x="${x}" y="${+y+4.5}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="Baloo 2,sans-serif">${i+1}</text></g>`;});
  h+='<g id="kid"></g><rect id="hit" x="-40" y="0" width="180" height="120" fill="transparent"/></svg>';
  $('svgw').innerHTML=h;$('pad').hidden=false;
  const svg=$('svgw').querySelector('svg'),hit=$('hit'),kid=$('kid');
  const refs=[...svg.querySelectorAll('.mold')].map(p=>{const n=p.getTotalLength(),a=[];for(let k=0;k<20;k++)a.push(p.getPointAtLength(n*k/19));return a;});
  let idx=0,cur=null,el=null;
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
  const path=()=>'M'+cur.map(p=>p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' L');
  hit.onpointerdown=e=>{if(idx>=P.length)return;e.preventDefault();hit.setPointerCapture(e.pointerId);cur=[pt(e)];
    el=document.createElementNS('http://www.w3.org/2000/svg','path');
    [['fill','none'],['stroke',col],['stroke-width','8'],['stroke-linecap','round'],['stroke-linejoin','round']].forEach(([k,v])=>el.setAttribute(k,v));
    el.setAttribute('d',path()+' l0.1 0.1');kid.appendChild(el);};
  hit.onpointermove=e=>{if(!cur)return;cur.push(pt(e));el.setAttribute('d',path());};
  const end=()=>{
    if(!cur)return;const pts=cur;cur=null;
    let T=0;for(let i=1;i<pts.length;i++)T+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    if(T<12){el.remove();return;}
    if(okStroke(pts,refs[idx])){
      el.setAttribute('stroke','#3ecf8e');$('bd'+idx).style.opacity=.15;idx++;
      if(idx>=P.length){
        svg.insertAdjacentHTML('beforeend','<text x="50" y="62" text-anchor="middle" font-size="46">🌟</text>');
        inst('Muito bem! Você escreveu a letra '+L[wIdx]+'! 🌟');
      }else inst('Muito bem! Agora o traço '+(idx+1)+'.');
    }else{el.remove();inst('Quase! Comece na bolinha '+(idx+1)+' e siga o caminho.');}
  };
  hit.onpointerup=end;hit.onpointercancel=end;
  say.textContent='Sua vez! Comece na bolinha 1 ✍️';speak('Agora é a sua vez! Comece na bolinha 1.');
}
const redo=()=>padMode==='trace'?drawTrace():drawLetter();
const H={rp:drawLetter,tr:drawTrace,
  pv:()=>{wIdx=Math.max(0,wIdx-1);redo();},
  nx:()=>{wIdx++;if(wIdx>=LS().length)drawLetter();else redo();},
  cl:()=>{closePad();inst('Toque numa letra para aprender a escrever.');}};
Object.entries(H).forEach(([k,f])=>$(k).onclick=()=>f());
function speakThen(t,cb){
  let ok=false;const go=()=>{if(!ok){ok=true;cb();}};
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.85;u.pitch=1.2;u.onend=go;speechSynthesis.speak(u);setTimeout(go,2000);}catch(e){go();}
}
const kbF=$('kb').onclick;
$('kb').onclick=e=>{kbF(e);if($('tb').style.display==='flex')inst('Digite uma palavra!');};
const micF=mic.onclick;
mic.onclick=e=>{if(listening||!SR)micF(e);else{say.textContent='Diga uma palavra!';speakThen('Diga uma palavra',()=>micF(e));}};
</script>
